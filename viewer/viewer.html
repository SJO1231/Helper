<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Helper 뷰어</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; font: 13px/1.4 "Malgun Gothic", system-ui, sans-serif; color: #1f2933; }
    body { display: flex; flex-direction: column; background: #f6f7f9; }
    #toolbar {
      flex: none; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
      padding: 8px 12px; background: #fff; border-bottom: 1px solid #e3e7ec;
    }
    #toolbar .spacer { flex: 1; }
    #toolbar label { display: inline-flex; gap: 6px; align-items: center; color: #52606d; }
    #toolbar button, #toolbar select {
      height: 28px; padding: 0 10px; font: inherit; color: #1f2933;
      background: #fff; border: 1px solid #cfd6de; border-radius: 6px;
    }
    #toolbar button { cursor: pointer; }
    #toolbar button:hover:not(:disabled) { background: #f3f5f8; }
    #toolbar button:disabled { color: #9aa5b1; cursor: default; }
    #column-picker { position: relative; }
    #column-picker summary { cursor: pointer; color: #52606d; }
    #column-list {
      position: absolute; z-index: 10; top: 26px; left: 0; display: flex; flex-direction: column; gap: 4px;
      max-height: 60vh; overflow: auto; padding: 8px 10px; white-space: nowrap;
      background: #fff; border: 1px solid #cfd6de; border-radius: 6px; box-shadow: 0 6px 20px rgba(15, 23, 42, .12);
    }
    #status {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; box-sizing: border-box; height: 26px;
      padding: 0 12px; line-height: 26px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
      font-size: 12px; color: #7b8794; background: #fff; border-top: 1px solid #e3e7ec;
    }
    #status.error { color: #b00020; }
    #grid {
      flex: 1; min-height: 0; margin: 8px 12px 34px;
      background: #fff; border: 1px solid #e3e7ec; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <label>테이블 <select id="table-select"></select></label>
    <span id="status">불러오는 중</span>
    <span class="spacer"></span>
    <label>열 <select id="type-column"></select></label>
    <label>타입 <select id="type-choice"></select></label>
    <details id="column-picker"><summary>열 보기</summary><div id="column-list"></div></details>
    <button id="columns-reset" type="button">열 초기화</button>
    <button id="type-apply" type="button">타입 적용</button>
    <button id="export-csv" type="button">CSV</button>
    <button id="export-xlsx" type="button">Excel</button>
  </div>
  <div id="grid"></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
